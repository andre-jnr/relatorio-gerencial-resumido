<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block titulo %}Gerencial{% endblock %} · {{ loja }}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23E8772E'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block estilos %}{% endblock %}
  <script>
    try { const t = localStorage.getItem('tema'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <header class="topo">
    <div class="topo__marca">
      <span class="sol" aria-hidden="true"></span>
      <div>
        <p class="topo__eyebrow">Relatório gerencial{% if gerente %} · {{ gerente }}{% endif %}</p>
        <h1 class="topo__titulo">{{ loja }}</h1>
      </div>
    </div>

    <div class="filtros" role="group" aria-label="Período">
      <label class="campo">
        <span class="campo__rotulo">Mês</span>
        <select id="filtro-mes"></select>
      </label>
      <label class="campo">
        <span class="campo__rotulo">Ano</span>
        <select id="filtro-ano"></select>
      </label>
      <button id="btn-atualizar" class="btn-icone" type="button" title="Consultar o banco de novo" aria-label="Atualizar">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
      </button>
      <button id="btn-tema" class="btn-icone" type="button" title="Alternar tema claro/escuro" aria-label="Alternar tema">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <nav class="abas" aria-label="Páginas">
    <a href="{{ url_for('index') }}" class="aba{% if aba == 'visao' %} aba--ativa{% endif %}"{% if aba == 'visao' %} aria-current="page"{% endif %}>Visão geral</a>
    <a href="{{ url_for('pagina_pagamentos') }}" class="aba{% if aba == 'pagamentos' %} aba--ativa{% endif %}"{% if aba == 'pagamentos' %} aria-current="page"{% endif %}>Pagamentos</a>
    <a href="{{ url_for('pagina_provisoes') }}" class="aba{% if aba == 'provisoes' %} aba--ativa{% endif %}"{% if aba == 'provisoes' %} aria-current="page"{% endif %}>Provisões</a>
  </nav>

  <div class="faixa-periodo">
    <span id="periodo-status" class="selo">—</span>
    <span id="periodo-texto" class="faixa-periodo__texto">Carregando…</span>
    <span id="periodo-progresso" class="progresso" aria-hidden="true"><span></span></span>
    <span id="atualizado" class="faixa-periodo__hora"></span>
  </div>

  <main id="conteudo" class="conteudo" aria-live="polite"></main>

  <footer class="rodape">
    Dados do SISMOURA ({{ loja }}), consulta somente leitura. Mês em andamento considera até ontem (D-1).
  </footer>

  <script>window.APP = { anoAtual: {{ ano_atual }}, mesAtual: {{ mes_atual }} };</script>
  <script src="{{ url_for('static', filename='js/comum.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
